<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#5fb6f2" />
<meta name="description" content="Tower Crash 3D — aim, match colors, topple the tower." />
<title>Tower Crash 3D</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235fb6f2'/%3E%3Crect x='12' y='4' width='8' height='5' rx='1' fill='%23ff4d5a'/%3E%3Crect x='12' y='11' width='8' height='5' rx='1' fill='%23ffd23f'/%3E%3Crect x='12' y='18' width='8' height='5' rx='1' fill='%2335e07c'/%3E%3Ccircle cx='16' cy='27' r='2.5' fill='%23ffffff'/%3E%3C/svg%3E" />

<link rel="stylesheet" href="./css/style.css" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js",
    "animejs": "https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.es.js"
  }
}
</script>
</head>
<body>

<!-- ============================================================
     SCENE HOST — Three.js canvas is appended here by js/game.js
     ============================================================ -->
<div id="scene" aria-hidden="true"></div>

<!-- CSS sky/ocean washes sit behind the transparent canvas -->
<div id="skyWash" aria-hidden="true"></div>
<div id="oceanWash" aria-hidden="true"></div>

<!-- ============================================================
     HUD
     ============================================================ -->
<div id="hud">

  <!-- ---------- TOP BAR ---------- -->
  <div class="topbar">

    <!-- Coins (top-left) -->
    <div class="coinChip" id="hudCoinsWrap" role="status" aria-live="polite" aria-label="Coins">
      <svg class="coinIcon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#ffcc33" />
        <circle cx="12" cy="12" r="10" fill="none" stroke="#c78f00" stroke-width="1.6" />
        <circle cx="12" cy="12" r="6.2" fill="none" stroke="#e8a900" stroke-width="1.4" />
        <text x="12" y="16.4" text-anchor="middle" font-family="Arial, sans-serif"
              font-size="9" font-weight="700" fill="#8a5f00">C</text>
      </svg>
      <span class="coinValue" id="hudCoins">0</span>
    </div>

    <!-- Level + progress (top-center) -->
    <div class="levelBlock" id="hudLevelWrap">
      <div class="levelLabels">
        <span class="levelNow" id="hudLevel">1</span>
        <span class="levelNext" id="hudLevelNext">Lv 2</span>
      </div>
      <div class="levelTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" aria-label="Level progress" id="hudProgress">
        <div class="levelFill" id="hudProgressFill"></div>
        <div class="levelNotch" id="hudProgressNotch"></div>
      </div>
    </div>

    <!-- Shop / cart (top-right) -->
    <button class="iconBtn" id="btnShop" type="button" aria-label="Shop" title="Shop">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 4h2.2l1.1 2.4h13.3l-2.2 8.1H7.6L5.7 8.5" fill="none"
              stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9.2" cy="19.2" r="1.7" fill="currentColor"/>
        <circle cx="17.3" cy="19.2" r="1.7" fill="currentColor"/>
      </svg>
    </button>

  </div>

  <!-- ---------- RIGHT-SIDE POWER-UPS ---------- -->
  <div class="powerRail" id="powerRail">

    <!-- Multiball (25 coins) -->
    <button class="powerCard" id="btnMultiball" type="button" aria-label="Multiball">
      <span class="powerIcon" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <circle cx="10" cy="12" r="4.4" fill="#ffffff" opacity=".95"/>
          <circle cx="21" cy="10.5" r="4.4" fill="#ffffff" opacity=".8"/>
          <circle cx="15.5" cy="21" r="4.4" fill="#ffffff" opacity=".7"/>
          <circle cx="25" cy="20.5" r="3" fill="#ffffff" opacity=".55"/>
        </svg>
      </span>
      <span class="powerLabel">Multiball</span>
      <span class="powerPrice">
        <svg class="miniCoin" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#ffcc33" stroke="#c78f00" stroke-width="1.6"/>
        </svg>
        <span class="priceNum" id="priceMultiball">25</span>
      </span>
      <span class="powerBadge" id="badgeMultiball">0</span>
    </button>

    <!-- Earthquake (50 coins) -->
    <button class="powerCard" id="btnEarthquake" type="button" aria-label="Earthquake">
      <span class="powerIcon" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <path d="M16 3.5 19.6 12l8.9 1.1-6.6 6.1 1.8 8.8L16 23.6 8.3 28l1.8-8.8-6.6-6.1L12.4 12z"
                fill="#ffffff" opacity=".95"/>
        </svg>
      </span>
      <span class="powerLabel">Earthquake</span>
      <span class="powerPrice">
        <svg class="miniCoin" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#ffcc33" stroke="#c78f00" stroke-width="1.6"/>
        </svg>
        <span class="priceNum" id="priceEarthquake">50</span>
      </span>
      <span class="powerBadge" id="badgeEarthquake">0</span>
    </button>

  </div>

  <!-- ---------- BOTTOM-LEFT: ball chip (secondary readout) ---------- -->
  <div class="ballChip" id="hudBallsWrap" role="status" aria-live="polite" aria-label="Balls remaining">
    <span class="ballDot" id="hudBallDot"></span>
    <span class="ballValue" id="hudBalls">0</span>
  </div>

  <!-- ---------- BOTTOM-CENTER: hint ---------- -->
  <div class="hint" id="hint">Move to aim · Tap to shoot</div>

</div>

<!-- ============================================================
     OVERLAY (intro / win / lose)
     ============================================================ -->
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="panel" id="panel">
    <h1 class="panelTitle" id="ovTitle">TOWER CRASH 3D</h1>
    <p class="panelText" id="ovText">
      Aim with the mouse, tap to fire.<br>
      <b>Match the colors</b> to smash the tower — everything else bounces off.
    </p>
    <button class="panelBtn" id="ovBtn" type="button">PLAY</button>
  </div>
</div>

<!-- Entry module — imports config.js and effects.js itself -->
<script type="module" src="./js/game.js"></script>
</body>
</html>
